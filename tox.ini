[tox]
requires = tox>=4.22
isolated_build = True
envlist = py3{10,11,12,13,14}-all

[testenv]
description = Runs the test suite.
passenv = *
set_env =
    PYTEST_ARGS = {posargs:tests src -n 0 --durations=10 --durations-min=1.0}
dependency_groups =
    test
deps =
    pip
    pytest-xdist
extras =
    mot_utils: mot-utils
    torchmetrics: torchmetrics
    yolo_models: yolo-models
    all: all
commands =
    !mot_utils-!torchmetrics-!yolo_models-!all: pytest {env:PYTEST_ARGS} -m "required"
    mot_utils: pytest {env:PYTEST_ARGS} -m "mot_utils"
    torchmetrics: pytest {env:PYTEST_ARGS} -m "torchmetrics"
    yolo_models: pytest {env:PYTEST_ARGS} -m "yolo_models"
    all: pytest {env:PYTEST_ARGS}

[testenv:min-deps]
description = Runs test suite against minimum supported versions of dependencies.
dependency_groups =
    test
deps =
    typing-extensions==4.1.0
    {[testenv]deps}
extras = torchmetrics
         yolo-models
         mot-utils
basepython = python3.10
commands = pytest {env:PYTEST_ARGS}

[testenv:coverage]
description = Runs test suite and measures test-coverage. Fails if coverage is
              below 90 percent.
dependency_groups =
    test
deps =
    {[testenv]deps}
    coverage[toml]
    pytest-cov
extras =
    torchmetrics
    yolo-models
    mot-utils
usedevelop = true
basepython = python3.12
setenv = NUMBA_DISABLE_JIT=1
commands = pytest --cov-report term-missing --cov-config=pyproject.toml --cov-fail-under=90 --cov=maite  tests {posargs: -n 0}

[testenv:scan-docs]
description = Validate that the MAITE public API has docstrings that adhere
              to the numpydoc standard, and that their example sections "scan clean"
              under pyright.
deps =
    --requirement deps/requirements-pyright.txt
dependency_groups =
    test
extras =
    torchmetrics
    yolo-models
commands = pytest tests/test_docstrings.py {posargs: -n 0}

[testenv:typecheck]
description = Ensure that the MAITE source code and test suite scan clean
              under pyright, and that the MAITE public API has a 100 percent
              type-completeness score.
usedevelop = true
basepython = python3.10
dependency_groups =
    test
extras =
    torchmetrics
    yolo-models
    mot-utils
commands =
    pyright src/ tests/
    pyright --ignoreexternal --verifytypes maite

[testenv:enforce-format]
description = Checks that MAITE source materials (code & docs) and test suite
              adhere to formatting and code-quality standards.
skip_install=true
basepython=python3.10
deps=
    ruff
    codespell[toml]
commands=
    ruff check
    ruff format --check
    codespell src/ docs/


[testenv:auto-format]
description = Format MAITE source materials (code & docs) and test suite
              adhere to formatting and code-quality standards.. Running
              this can help fix a failing `enforce-format` run.
skip_install=true
deps =
    ruff
commands =
    ruff check --fix
    ruff format

[testenv:docs]
description = Uses Sphinx to generate html for the MAITE docs. Stores the
              results in `.tox/docs/build/html/`.
basepython=python3.12
changedir=docs
deps=-r{toxinidir}/docs/requirements.txt
dependency_groups =
    builddocs
extras =
    yolo-models
    torchmetrics
allowlist_externals=/usr/bin/make
commands=
    make clean BUILDDIR={envdir}/build
    make BUILDDIR={envdir}/build
