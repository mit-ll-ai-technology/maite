repos:
- repo: local
  hooks:
    - id: ruff-check
      name: ruff check
      entry: uv run --locked --only-group lint ruff check --fix
      language: system
      types_or: [python, pyi, jupyter, markdown]
      require_serial: true
    - id: ruff-format
      name: ruff format
      entry: uv run --locked --only-group lint ruff format
      language: system
      types_or: [python, pyi, jupyter, markdown]
      require_serial: true
- repo: https://github.com/codespell-project/codespell
  rev: v2.2.6
  hooks:
    - id: codespell
      exclude: \.(ipynb|lock)$
- repo: https://github.com/kynan/nbstripout
  rev: 0.8.1
  hooks:
    - id: nbstripout
      args: ['--extra-keys=metadata.kernelspec metadata.language_info']
